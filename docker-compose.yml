services:
  frontend:
    build:
      context: ./wesupply
      dockerfile: Dockerfile
    container_name: wesupply-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    volumes:
      - ./wesupply:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wesupply-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://wesupply:wesupply@db:5432/wesupply
      - JWT_SECRET=wesupply-dev-secret
      - FRONTEND_ORIGIN=http://localhost:3000
      - GEMINI_MODEL=gemini-2.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: wesupply-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=wesupply
      - POSTGRES_PASSWORD=wesupply
      - POSTGRES_DB=wesupply
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
